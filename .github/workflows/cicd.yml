name: Docker Build, Test and Push

on:
  push:
    branches: [ main ]

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
            IMAGE_TAG=myapp:${{ github.sha }}
            docker build -f dev/Dockerfile -t $IMAGE_TAG .
            echo "Built image: $IMAGE_TAG"

      - name: Run container and test
        run: |
          IMAGE_TAG=myapp:${{ github.sha }}
          docker run -d --name myapp-test -p 8080:80 $IMAGE_TAG
          sleep 5
          curl -f http://localhost:8080 || exit 1
          docker stop myapp-test
          docker rm myapp-test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image
        run: |
          IMAGE_TAG=myapp:${{ github.sha }}
          docker tag $IMAGE_TAG ${{ secrets.DOCKER_USERNAME }}/myapp:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/myapp:${{ github.sha }}