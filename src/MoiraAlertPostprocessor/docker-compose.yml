version: "3.8"
services:
  moira-postprocessor:
    build: .
    image: moira-postprocessor:latest
    ports:
      - "8080:8080"
    environment:
      - Ollama__Endpoint=${OLLAMA_ENDPOINT:-http://host.docker.internal:11434/api/generate}
      - Ollama__Model=${OLLAMA_MODEL:-gpt-oss:20b-cloud}
      - Ollama__TimeoutSeconds=${OLLAMA_TIMEOUT_SECONDS:-30}
    restart: unless-stopped